name: flutter_document_scanner_android

on:
  pull_request:
    paths:
      - ".github/workflows/flutter_document_scanner_android.yaml"
      - "flutter_document_scanner_android/**"
  push:
    branches:
      - master
      - develop
      - stable/*
    paths:
      - ".github/workflows/flutter_document_scanner_android.yaml"
      - "flutter_document_scanner_android/**"

jobs:
  build:
    uses: criistian14/flutter_document_scanner/.github/workflows/flutter_package.yml@develop
    with:
      flutter_channel: stable
      flutter_version: 3.24.0
      working_directory: flutter_document_scanner_android
      min_coverage: 80
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
